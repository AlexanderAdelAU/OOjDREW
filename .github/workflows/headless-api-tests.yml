name: Headless API regression tests

on:
  push:
    branches:
      - feature/headless-reasoning-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-api:
    name: Java 8 regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out OO jDREW
        uses: actions/checkout@v4
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Compile and run JUnit 3 regression tests
        # Upstream uses JUnit 3.8.1, unsupported by the runner's newer
        # default Surefire. Pin a compatible runner without changing pom.xml.
        run: mvn --batch-mode --no-transfer-progress -Djava-version=1.8 test-compile org.apache.maven.plugins:maven-surefire-plugin:2.22.2:test
